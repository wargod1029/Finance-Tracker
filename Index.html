<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>💰 Finance Tracker</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
      background: #f2f6fc;
      color: #1e2b3c;
      padding: 16px;
      max-width: 560px;
      margin: 0 auto;
    }

    /* ----- TOP BANNER ----- */
    .app-banner {
      background: linear-gradient(135deg, #1e3a5f, #2a4d7a);
      color: white;
      border-radius: 28px 28px 20px 20px;
      padding: 20px 20px 12px 20px;
      box-shadow: 0 8px 18px rgba(0,20,40,0.20);
      margin-bottom: 12px;
    }
    .app-banner h1 {
      font-size: 26px;
      font-weight: 600;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .app-banner h1 small {
      font-size: 14px;
      font-weight: 400;
      opacity: 0.8;
      margin-left: auto;
      background: rgba(255,255,255,0.15);
      padding: 4px 14px;
      border-radius: 40px;
    }

    /* ----- NAV TABS (pages) ----- */
    .nav-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 12px 0 4px 0;
      padding: 0 2px;
    }
    .nav-tabs button {
      flex: 1 0 auto;
      background: rgba(255,255,255,0.08);
      border: none;
      color: #e0edff;
      font-weight: 500;
      font-size: 14px;
      padding: 8px 12px;
      border-radius: 40px;
      backdrop-filter: blur(2px);
      transition: all 0.2s;
      border: 1px solid transparent;
      cursor: pointer;
      min-width: 64px;
    }
    .nav-tabs button.active-tab {
      background: white;
      color: #1e3a5f;
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      border-color: rgba(255,255,255,0.3);
    }
    .nav-tabs button:active { transform: scale(0.96); }

    /* ----- PAGE CONTAINER ----- */
    .page-container {
      background: white;
      border-radius: 24px;
      padding: 20px 16px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.04);
      margin-top: 12px;
    }

    /* ----- MAIN PAGE (home) ----- */
    .person-toggle {
      display: flex;
      gap: 12px;
      margin-bottom: 18px;
    }
    .person-toggle button {
      flex: 1;
      padding: 12px;
      border: 2px solid #dde5ed;
      background: #f8faff;
      border-radius: 60px;
      font-weight: 600;
      font-size: 16px;
      color: #1e3a5f;
      cursor: pointer;
      transition: all 0.15s;
    }
    .person-toggle button.active-his {
      background: #d4e2f7;
      border-color: #2a6b9e;
      color: #0c2b4a;
      box-shadow: 0 0 0 2px rgba(42,107,158,0.2);
    }
    .person-toggle button.active-hers {
      background: #fce4e1;
      border-color: #b9514a;
      color: #7a2f2a;
      box-shadow: 0 0 0 2px rgba(185,81,74,0.2);
    }

    .input-card {
      background: #f9fcff;
      border-radius: 20px;
      padding: 16px;
      border: 1px solid #eaf0f6;
      margin-bottom: 18px;
    }
    .input-card label {
      font-weight: 600;
      font-size: 13px;
      color: #3d5a78;
      display: block;
      margin: 10px 0 2px 0;
    }
    .input-card input, .input-card select {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid #dfe8f0;
      border-radius: 14px;
      font-size: 15px;
      background: white;
      transition: 0.15s;
      margin-top: 2px;
    }
    .input-card input:focus, .input-card select:focus {
      border-color: #2a6b9e;
      outline: none;
      box-shadow: 0 0 0 3px rgba(42,107,158,0.15);
    }
    .input-card .row-buttons {
      display: flex;
      gap: 8px;
      margin-top: 6px;
    }
    .input-card .row-buttons button {
      flex: 1;
      background: #1e3a5f;
      color: white;
      border: none;
      font-weight: 600;
      padding: 14px;
      border-radius: 60px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.1s;
      margin-top: 6px;
    }
    .input-card .row-buttons button:active { transform: scale(0.97); }

    /* favourites */
    .fav-section {
      margin: 12px 0 6px 0;
    }
    .fav-title {
      font-weight: 600;
      font-size: 14px;
      color: #3d5a78;
      margin-bottom: 8px;
    }
    .fav-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .fav-btn {
      background: #f0f5fb;
      border: 2px solid #dce6ef;
      border-radius: 40px;
      padding: 6px 16px 6px 16px;
      font-size: 13px;
      font-weight: 500;
      color: #1e3a5f;
      cursor: pointer;
      transition: 0.1s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .fav-btn .price-tag {
      background: rgba(0,0,0,0.04);
      border-radius: 30px;
      padding: 0 8px;
      font-size: 12px;
      font-weight: 600;
      color: #1f4970;
    }
    .fav-btn.his-fav { border-color: #3c7bb3; background: #e1edfa; }
    .fav-btn.hers-fav { border-color: #c46b63; background: #fae7e4; }
    .fav-btn:active { transform: scale(0.94); }

    /* entries list – only last 3 */
    .entry-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 0;
      border-bottom: 1px solid #ebf0f6;
    }
    .entry-item:last-of-type { border-bottom: none; }
    .entry-left .entry-title {
      font-weight: 600;
      font-size: 16px;
    }
    .entry-left .entry-meta {
      font-size: 13px;
      color: #5f748b;
      margin-top: 2px;
    }
    .entry-left .entry-meta .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      padding: 0 10px;
      border-radius: 40px;
      margin-right: 4px;
    }
    .badge-his { background: #d4e2f7; color: #1a4570; }
    .badge-hers { background: #fce4e1; color: #91443e; }
    .entry-price {
      font-weight: 700;
      font-size: 17px;
    }
    .entry-price.income { color: #1f8b4c; }
    .entry-price.expense { color: #b13e3a; }

    .empty-message {
      color: #7b8fa3;
      text-align: center;
      padding: 30px 0;
      font-size: 15px;
    }

    /* toast */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #1e2c3f;
      color: white;
      padding: 12px 28px;
      border-radius: 60px;
      font-weight: 500;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      opacity: 0;
      transition: opacity 0.2s;
      z-index: 999;
      pointer-events: none;
      font-size: 15px;
    }
    .toast.show { opacity: 1; }

    /* placeholder pages */
    .placeholder-page {
      text-align: center;
      padding: 40px 10px;
      color: #5a738b;
    }
    .placeholder-page h2 {
      font-weight: 400;
      color: #1e3a5f;
      margin-bottom: 6px;
    }
    .placeholder-page p { font-size: 15px; }

    /* hide/show pages */
    .page { display: none; }
    .page.active-page { display: block; }

    /* month indicator */
    .month-indicator {
      background: #eaf1fa;
      border-radius: 60px;
      padding: 6px 16px;
      font-weight: 500;
      font-size: 14px;
      display: inline-block;
      margin-bottom: 12px;
      color: #1e3a5f;
    }

    /* small tweaks */
    .mt-1 { margin-top: 6px; }
    .text-center { text-align: center; }

    /* ----- SUMMARY PAGE ----- */
    .summary-page {
      padding: 4px 0;
    }
    .summary-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 18px;
    }
    .summary-header h2 {
      color: #1e3a5f;
      font-size: 22px;
    }
    .summary-month {
      flex: 1;
      max-width: 170px;
      padding: 9px 10px;
      border: 2px solid #dfe8f0;
      border-radius: 14px;
      background: white;
      color: #1e3a5f;
      font-size: 14px;
    }
    .summary-month:focus {
      border-color: #2a6b9e;
      outline: none;
      box-shadow: 0 0 0 3px rgba(42,107,158,0.15);
    }
    .summary-total {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px;
      border-radius: 16px;
      margin-bottom: 14px;
      font-weight: 600;
    }
    .summary-total.his-total { background: #e1edfa; color: #1a4570; }
    .summary-total.hers-total { background: #fae7e4; color: #91443e; }
    .summary-total.together-total { background: #eef1f4; color: #3d5369; }
    .summary-total strong { font-size: 20px; }
    .summary-section {
      border-top: 1px solid #ebf0f6;
      padding-top: 14px;
      margin-top: 18px;
    }
    .summary-section h3 {
      color: #1e3a5f;
      font-size: 16px;
      margin-bottom: 8px;
    }
    .summary-row {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #ebf0f6;
      color: #3d5a78;
    }
    .summary-row:last-child { border-bottom: none; }
    .summary-row strong { color: #1e2b3c; }
    .summary-status {
      color: #7b8fa3;
      text-align: center;
      padding: 28px 0;
    }
    .chart-card {
      background: #f9fcff;
      border: 1px solid #eaf0f6;
      border-radius: 18px;
      padding: 14px;
      margin-top: 14px;
    }
    .chart-card h3 {
      color: #1e3a5f;
      font-size: 16px;
      margin-bottom: 10px;
    }
    .pie-chart {
      display: block;
      width: 210px;
      height: 210px;
      max-width: 100%;
      margin: 0 auto 12px;
    }
    .chart-legend {
      display: grid;
      gap: 7px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: #3d5a78;
      font-size: 13px;
    }
    .legend-label {
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .legend-swatch {
      width: 11px;
      height: 11px;
      border-radius: 3px;
      flex: 0 0 auto;
    }
    .compare-page {
      padding: 4px 0;
    }
  </style>
</head>
<body>

<!-- ===== TOP BANNER ===== -->
<div class="app-banner">
  <h1>
    💰 Finance Tracker
    <small>V11</small>
  </h1>
  <!-- Navigation Tabs -->
  <div class="nav-tabs">
    <button class="active-tab" data-page="home">🏠 Home</button>
    <button data-page="summary">📊 Summary</button>
    <button data-page="compare">⚖️ Compare</button>
    <button data-page="year">📅 Year</button>
  </div>
</div>

<!-- ===== PAGE CONTAINER ===== -->
<div class="page-container">

  <!-- ========== HOME PAGE ========== -->
  <div id="page-home" class="page active-page">
    <!-- person toggle -->
    <div class="person-toggle">
      <button id="btnHis" class="active-his" onclick="setPerson('his')">👨 戰神</button>
      <button id="btnHers" onclick="setPerson('hers')">👩 紫璃</button>
    </div>

    <!-- input card -->
    <div class="input-card">
      <label>📅 Date</label>
      <input type="date" id="entryDate" onchange="updateMonthDisplay()">

      <label>📂 Category</label>
      <select id="entryCategory">
        <option value="個人">個人</option>
        <option value="一齊">一齊</option>
        <option value="交通">交通</option>
        <option value="公司/學校">公司/學校</option>
        <option value="收入">收入</option>
      </select>

      <label>📝 Title</label>
      <input type="text" id="entryTitle" placeholder="e.g. Lunch">

      <label>💰 Price (HK$)</label>
      <input type="number" id="entryPrice" placeholder="0.00" step="0.1">

      <label>🚌 Route (Transport only)</label>
      <input type="text" id="entryRoute" placeholder="e.g. MTR" list="routeList">
      <datalist id="routeList"></datalist>

      <div class="row-buttons">
        <button onclick="submitEntry()">➕ Add</button>
      </div>
    </div>

    <!-- Favourites -->
    <div class="fav-section">
      <div class="fav-title">⭐ 我的最愛</div>
      <div id="favouritesContainer"><span style="color:#7b8fa3;font-size:14px;">Loading...</span></div>
    </div>

    <!-- Recent entries (last 3) -->
    <div style="margin-top: 18px;">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span style="font-weight:600; color:#1e3a5f;">📋 Recent (last 3)</span>
        <span class="month-indicator" id="currentMonthDisplay">📅 Jan</span>
      </div>
      <div id="entriesList" style="margin-top: 6px;">Loading...</div>
    </div>
  </div>

  <!-- ========== SUMMARY PAGE ========== -->
  <div id="page-summary" class="page">
    <div class="summary-page">
      <div class="summary-header">
        <h2>📊 Summary</h2>
        <select id="summaryMonth" class="summary-month" aria-label="Summary month"></select>
      </div>
      <div id="summaryContent" class="summary-status">Loading...</div>
    </div>
  </div>

  <!-- ========== COMPARE PAGE (placeholder) ========== -->
  <div id="page-compare" class="page">
    <div class="compare-page">
      <div class="summary-header">
        <h2>⚖️ Compare</h2>
        <select id="compareMonth" class="summary-month" aria-label="Compare month"></select>
      </div>
      <div id="compareContent" class="summary-status">Loading...</div>
      <div id="compareChartCard" class="chart-card" hidden>
        <h3>一齊 expense</h3>
        <canvas id="togetherCompareChart" class="pie-chart" width="420" height="420"></canvas>
        <div id="togetherCompareLegend" class="chart-legend"></div>
      </div>
    </div>
  </div>

  <!-- ========== YEAR PAGE ========== -->
  <div id="page-year" class="page">
    <div class="summary-page">
      <div class="summary-header">
        <h2>📅 Year Summary</h2>
        <select id="summaryYear" class="summary-month" aria-label="Summary year"></select>
      </div>
      <div id="yearSummaryContent" class="summary-status">Loading...</div>
    </div>
  </div>

</div>

<!-- Toast -->
<div id="toast" class="toast"></div>

<script>
  // ===================== CONFIG =====================
  let currentPerson = "his";
  let favouritesData = { his: [], hers: [] };
  const monthNames = ["January","February","March","April","May","June","July","August","September","October","November","December"];

  // ===================== NAVIGATION =====================
  document.querySelectorAll('.nav-tabs button').forEach(btn => {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.nav-tabs button').forEach(b => b.classList.remove('active-tab'));
      this.classList.add('active-tab');
      const page = this.dataset.page;
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
      document.getElementById('page-' + page).classList.add('active-page');
      if (page === 'summary') loadSummary();
      if (page === 'compare') loadCompare();
      if (page === 'year') loadYearSummary();
    });
  });

  // ===================== HELPERS =====================
  function getMonthFromDate(dateString) {
    if (!dateString) return null;
    const d = new Date(dateString);
    return monthNames[d.getMonth()];
  }

  function updateMonthDisplay() {
    const dateInput = document.getElementById('entryDate');
    const m = getMonthFromDate(dateInput.value);
    if (m) document.getElementById('currentMonthDisplay').textContent = '📅 ' + m;
  }

  // ===================== SET TODAY =====================
  document.addEventListener('DOMContentLoaded', function() {
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('entryDate').value = today;
    updateMonthDisplay();
    loadEntries();
    loadRoutes();
    loadFavourites();
    loadSummaryMonths();
    loadYears();
  });

  // ===================== LOAD ROUTES =====================
  function loadRoutes() {
    google.script.run
      .withSuccessHandler(function(routes) {
        const datalist = document.getElementById('routeList');
        datalist.innerHTML = '';
        Object.keys(routes).forEach(k => {
          const opt = document.createElement('option');
          opt.value = k;
          datalist.appendChild(opt);
        });
      })
      .getRoutes();
  }

  // ===================== SUMMARY =====================
  function loadSummaryMonths() {
    google.script.run
      .withSuccessHandler(function(months) {
        const select = document.getElementById('summaryMonth');
        const compareSelect = document.getElementById('compareMonth');
        const currentMonth = getMonthFromDate(document.getElementById('entryDate').value);
        const availableMonths = Array.isArray(months) ? months : [];
        const options = availableMonths.slice();
        if (currentMonth && !options.includes(currentMonth)) options.push(currentMonth);
        options.sort((a, b) => monthNames.indexOf(a) - monthNames.indexOf(b));
        select.innerHTML = options.map(month => `<option value="${month}">${month}</option>`).join('');
        compareSelect.innerHTML = select.innerHTML;
        if (currentMonth && options.includes(currentMonth)) select.value = currentMonth;
        if (currentMonth && options.includes(currentMonth)) compareSelect.value = currentMonth;
        select.onchange = loadSummary;
        compareSelect.onchange = loadCompare;
        loadSummary();
      })
      .withFailureHandler(function() {
        document.getElementById('summaryContent').innerHTML = '<div class="summary-status">❌ Error loading months</div>';
      })
      .getMonths();
  }

  function loadYears() {
    google.script.run
      .withSuccessHandler(function(years) {
        const select = document.getElementById('summaryYear');
        const currentYear = new Date().getFullYear().toString();
        const options = (Array.isArray(years) ? years : []).map(String);
        if (!options.includes(currentYear)) options.push(currentYear);
        options.sort((a, b) => Number(b) - Number(a));
        select.innerHTML = options.map(year => `<option value="${year}">${year}</option>`).join('');
        select.value = currentYear;
        select.onchange = loadYearSummary;
        loadYearSummary();
      })
      .withFailureHandler(function() {
        document.getElementById('yearSummaryContent').innerHTML = '<div class="summary-status">❌ Error loading years</div>';
      })
      .getYears();
  }

  function loadSummary() {
    const month = document.getElementById('summaryMonth').value;
    if (!month) {
      document.getElementById('summaryContent').innerHTML = '<div class="summary-status">📭 No month selected</div>';
      return;
    }
    document.getElementById('summaryContent').innerHTML = '<div class="summary-status">Loading...</div>';
    google.script.run
      .withSuccessHandler(renderSummary)
      .withFailureHandler(function() {
        document.getElementById('summaryContent').innerHTML = '<div class="summary-status">❌ Error loading summary</div>';
      })
      .getSummary(month);
  }

  function loadYearSummary() {
    const year = document.getElementById('summaryYear').value;
    if (!year) {
      document.getElementById('yearSummaryContent').innerHTML = '<div class="summary-status">📭 No year selected</div>';
      return;
    }
    document.getElementById('yearSummaryContent').innerHTML = '<div class="summary-status">Loading...</div>';
    google.script.run
      .withSuccessHandler(renderYearSummary)
      .withFailureHandler(function() {
        document.getElementById('yearSummaryContent').innerHTML = '<div class="summary-status">❌ Error loading year summary</div>';
      })
      .getYearSummary(year);
  }

  function formatMoney(value) {
    return '$' + (parseFloat(value) || 0).toFixed(2);
  }

  function drawPieChart(canvas, values, colors) {
    const context = canvas.getContext('2d');
    const size = Math.min(canvas.clientWidth || 210, canvas.clientHeight || 210);
    const pixelRatio = window.devicePixelRatio || 1;
    canvas.width = size * pixelRatio;
    canvas.height = size * pixelRatio;
    context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
    context.clearRect(0, 0, size, size);

    const total = values.reduce((sum, value) => sum + value, 0);
    const center = size / 2;
    const radius = size * 0.43;
    if (!total) {
      context.beginPath();
      context.moveTo(center, center);
      context.arc(center, center, radius, 0, Math.PI * 2);
      context.fillStyle = '#e5ebf1';
      context.fill();
      return false;
    }

    let startAngle = -Math.PI / 2;
    values.forEach((value, index) => {
      if (value <= 0) return;
      const endAngle = startAngle + (value / total) * Math.PI * 2;
      context.beginPath();
      context.moveTo(center, center);
      context.arc(center, center, radius, startAngle, endAngle);
      context.closePath();
      context.fillStyle = colors[index];
      context.fill();
      startAngle = endAngle;
    });

    context.beginPath();
    context.arc(center, center, radius * 0.52, 0, Math.PI * 2);
    context.fillStyle = '#ffffff';
    context.fill();
    return true;
  }

  function renderChartLegend(container, labels, values, colors) {
    const total = values.reduce((sum, value) => sum + value, 0);
    container.innerHTML = labels.map((label, index) => {
      const value = values[index];
      const percentage = total ? Math.round((value / total) * 100) : 0;
      return `<div class="legend-item">
        <span class="legend-label"><span class="legend-swatch" style="background:${colors[index]}"></span>${label}</span>
        <strong>${formatMoney(value)} (${percentage}%)</strong>
      </div>`;
    }).join('');
  }

  function renderPersonChart(canvasId, legendId, labels, categories, colors) {
    const values = labels.map(label => parseFloat((categories || {})[label]) || 0);
    drawPieChart(document.getElementById(canvasId), values, colors);
    renderChartLegend(document.getElementById(legendId), labels, values, colors);
  }

  function renderSummary(summary) {
    const categoryNames = ['個人', '一齊', '交通', '公司/學校'];
    const renderRows = function(categories) {
      return categoryNames.map(category => `
        <div class="summary-row">
          <span>${category}</span><strong>${formatMoney((categories || {})[category])}</strong>
        </div>
      `).join('');
    };

    document.getElementById('summaryContent').innerHTML = `
      <div class="summary-total his-total"><span>👨 戰神 expenses</span><strong>${formatMoney(summary.hisTotal)}</strong></div>
      <div class="summary-total hers-total"><span>👩 紫璃 expenses</span><strong>${formatMoney(summary.hersTotal)}</strong></div>
      <div class="summary-total together-total"><span>一齊 total</span><strong>${formatMoney(summary.togetherTotal)}</strong></div>
      <div class="summary-section">
        <h3>👨 戰神 by category</h3>
        ${renderRows(summary.hisByCategory)}
      </div>
      <div class="chart-card">

  function loadCompare() {

      content.innerHTML = '<div class="summary-status">📭 No month selected</div>';
      chartCard.hidden = true;
      return;
    }

      .withSuccessHandler(renderCompare)

        content.innerHTML = '<div class="summary-status">❌ Error loading comparison</div>';
      })

  // ===================== FAVOURITES =====================
  function loadFavourites() {
    google.script.run
      .withSuccessHandler(function(data) {
        favouritesData = data;
        renderFavourites(currentPerson);
      })
      .withFailureHandler(function() {
        document.getElementById('favouritesContainer').innerHTML = '<span style="color:#888;">⚠️ error</span>';
      })
      .getFavourites();
  }

  function renderFavourites(person) {
    const container = document.getElementById('favouritesContainer');
    const list = favouritesData[person] || [];
    if (!list.length) {
      container.innerHTML = '<span style="color:#7b8fa3;font-size:14px;">No favourites</span>';
      return;
    }
    const cls = person === 'his' ? 'his-fav' : 'hers-fav';
    let html = '<div class="fav-grid">';
    list.forEach((fav, idx) => {
      html += `<button class="fav-btn ${cls}" onclick="useFavourite(${idx})">
        ${fav.title} <span class="price-tag">$${parseFloat(fav.price||0).toFixed(2)}</span>
      </button>`;
    });
    html += '</div>';
    container.innerHTML = html;
  }

  function useFavourite(idx) {
    const fav = favouritesData[currentPerson]?.[idx];
    if (!fav) return;
    document.getElementById('entryTitle').value = fav.title || '';
    document.getElementById('entryPrice').value = fav.price || '';
    document.getElementById('entryCategory').value = fav.category || '交通';
    document.getElementById('entryRoute').value = fav.route || '';
    showToast('📋 Filled: ' + fav.title);
  }

  // ===================== PERSON TOGGLE =====================
  function setPerson(person) {
    currentPerson = person;
    document.getElementById('btnHis').className = person === 'his' ? 'active-his' : '';
    document.getElementById('btnHers').className = person === 'hers' ? 'active-hers' : '';
    renderFavourites(person);
  }

  // ===================== SUBMIT ENTRY =====================
  function submitEntry() {
    const date = document.getElementById('entryDate').value;
    const month = getMonthFromDate(date);
    if (!date) { showToast('⚠️ Select date'); return; }
    if (!month) { showToast('⚠️ Invalid date'); return; }

    const category = document.getElementById('entryCategory').value;
    const title = document.getElementById('entryTitle').value.trim();
    const price = parseFloat(document.getElementById('entryPrice').value) || 0;
    const routeInput = document.getElementById('entryRoute').value.trim();
    if (!title) { showToast('⚠️ Enter title'); return; }

    const payload = { month, person: currentPerson, date, category, title, price, routeInput };

    google.script.run
      .withSuccessHandler(function(result) {
        showToast(result.message || '✅ Saved');
        loadEntries(month);
        document.getElementById('entryTitle').value = '';
        document.getElementById('entryPrice').value = '';
        document.getElementById('entryRoute').value = '';
      })
      .withFailureHandler(function(err) {
        showToast('❌ ' + err);
        console.error(err);
      })
      .addEntry(payload);
  }

  // ===================== LOAD ENTRIES (only last 3) =====================
  function loadEntries(month) {
    if (!month) {
      const date = document.getElementById('entryDate').value;
      month = getMonthFromDate(date);
      if (!month) {
        document.getElementById('entriesList').innerHTML = '<div class="empty-message">📭 Select a date</div>';
        return;
      }
    }

    google.script.run
      .withSuccessHandler(function(data) {
        renderEntries(data);
      })
      .withFailureHandler(function(err) {
        document.getElementById('entriesList').innerHTML = '<div class="empty-message">❌ Error loading</div>';
        console.error(err);
      })
      .getEntries(month);
  }

  // ===================== RENDER LAST 3 =====================
  function renderEntries(data) {
    const all = [...(data.his || []), ...(data.hers || [])];
    if (all.length === 0) {
      document.getElementById('entriesList').innerHTML = '<div class="empty-message">📭 No entries this month</div>';
      return;
    }
    // sort by date desc (most recent first)
    all.sort((a,b) => (a.date < b.date ? 1 : -1));
    const lastThree = all.slice(0, 3);

    let html = '';
    lastThree.forEach(entry => {
      const price = parseFloat(entry.price) || 0;
      const isIncome = (entry.category === '收入');
      const sign = isIncome ? '+' : '-';
      const color = isIncome ? '#1f8b4c' : '#b13e3a';
      const personLabel = entry.person === '戰神' ? '戰神' : '紫璃';
      const badgeCls = entry.person === '戰神' ? 'badge-his' : 'badge-hers';
      const routeHtml = entry.route ? `🚌 ${entry.route}` : '';
      html += `
        <div class="entry-item">
          <div class="entry-left">
            <div class="entry-title">${entry.title}</div>
            <div class="entry-meta">
              <span class="badge ${badgeCls}">${personLabel}</span>
              ${entry.date} · ${entry.category} ${routeHtml}
            </div>
          </div>
          <div class="entry-price ${isIncome?'income':'expense'}">${sign}$${price.toFixed(2)}</div>
        </div>
      `;
    });
    document.getElementById('entriesList').innerHTML = html;
  }

  // ===================== TOAST =====================
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove('show'), 2800);
  }

  // expose to HTML
  window.setPerson = setPerson;
  window.useFavourite = useFavourite;
  window.submitEntry = submitEntry;
  window.updateMonthDisplay = updateMonthDisplay;


// ============ CONFIGURATION ============
const LOOKUP_SHEET = "Lookup";
const CATEGORIES = ["個人", "一齊", "交通", "公司/學校", "收入"];

// ============ GET FAVOURITES ============
function getFavourites() {
  try {
    const ss = SpreadsheetApp.getActiveSpreadsheet();
    let sheet = ss.getSheetByName(LOOKUP_SHEET);
    
    if (!sheet) {
      sheet = ss.insertSheet(LOOKUP_SHEET);
      const headers = ["Person", "Title", "Price", "Category", "Route"];
      sheet.getRange(1, 1, 1, headers.length).setValues([headers]);
      return { his: [], hers: [] };
    }
    
    const data = sheet.getDataRange().getValues();
    const his = [];
    const hers = [];
    
    for (let i = 1; i < data.length; i++) {
      const row = data[i];
      if (!row[0] || !row[1]) continue;
      
      const person = row[0] ? row[0].toString().trim() : '';
      const title = row[1] ? row[1].toString().trim() : '';
      const price = parseFloat(row[2]) || 0;
      const category = row[3] ? row[3].toString().trim() : '交通';
      const route = row[4] ? row[4].toString().trim() : '';
      
      if (!title) continue;
      
      const fav = {
        title: title,
        price: price,
        category: category,
        route: route
      };
      
      if (person === '戰神') {
        his.push(fav);
      } else if (person === '紫璃') {
        hers.push(fav);
      }
    }
    
    return { his, hers };
  } catch (error) {
    console.error('Error in getFavourites:', error);
    return { his: [], hers: [] };
  }
}

// ============ ADD FAVOURITE ============
function addFavourite(person, title, price, category, route) {
  try {
    const ss = SpreadsheetApp.getActiveSpreadsheet();
    let sheet = ss.getSheetByName(LOOKUP_SHEET);
    
    if (!sheet) {
      sheet = ss.insertSheet(LOOKUP_SHEET);
      const headers = ["Person", "Title", "Price", "Category", "Route"];
      sheet.getRange(1, 1, 1, headers.length).setValues([headers]);
    }
    
    const lastRow = sheet.getLastRow();
    const newRow = Math.max(lastRow + 1, 2);
    
    const rowData = [
      person === 'his' ? '戰神' : '紫璃',
      title,
      parseFloat(price) || 0,
      category || '交通',
      route || ''
    ];
    
    sheet.getRange(newRow, 1, 1, rowData.length).setValues([rowData]);
    
    return { 
      success: true, 
      message: '✅ Favourite added!'
    };
  } catch (error) {
    console.error('Error in addFavourite:', error);
    return { success: false, message: '❌ Error: ' + error.toString() };
  }
}

// ============ DELETE FAVOURITE ============
function deleteFavourite(person, title) {
  try {
    const ss = SpreadsheetApp.getActiveSpreadsheet();
    const sheet = ss.getSheetByName(LOOKUP_SHEET);
    if (!sheet) return { success: false, message: 'Sheet not found' };
    
    const data = sheet.getDataRange().getValues();
    const personName = person === 'his' ? '戰神' : '紫璃';
    
    for (let i = data.length - 1; i > 0; i--) {
      if (data[i][0] === personName && data[i][1] === title) {
        sheet.deleteRow(i + 1);
        return { success: true, message: '🗑️ Favourite deleted!' };
      }
    }
    
    return { success: false, message: 'Favourite not found' };
  } catch (error) {
    console.error('Error in deleteFavourite:', error);
    return { success: false, message: '❌ Error: ' + error.toString() };
  }
}

// ============ DO GET ============
function doGet() {
  return HtmlService.createHtmlOutputFromFile("Index")
    .setTitle("💰 Our Finance Tracker")
    .setXFrameOptionsMode(HtmlService.XFrameOptionsMode.ALLOWALL)
    .addMetaTag("viewport", "width=device-width, initial-scale=1");
}

// ============ GET MONTHS ============
function getMonths() {
  const ss = SpreadsheetApp.getActiveSpreadsheet();
  const sheets = ss.getSheets();
  const months = [];
  for (let i = 0; i < sheets.length; i++) {
    const name = sheets[i].getName();
    if (name !== LOOKUP_SHEET && name !== "Summary") {
      months.push(name);
    }
  }
  return months.sort();
}

// ============ GET ROUTES ============
function getRoutes() {
  try {
    const ss = SpreadsheetApp.getActiveSpreadsheet();
    const sheet = ss.getSheetByName(LOOKUP_SHEET);
    if (!sheet) return {};
    
    const data = sheet.getDataRange().getValues();
    const routes = {};
    for (let i = 1; i < data.length; i++) {
      if (data[i][0]) {
        const routeName = data[i][0].toString().trim();
        routes[routeName] = data[i][1] || routeName;
      }
    }
    return routes;
  } catch (error) {
    console.error('Error in getRoutes:', error);
    return {};
  }
}

// ============ GET ENTRIES ============
function getEntries(month) {
  try {
    const ss = SpreadsheetApp.getActiveSpreadsheet();
    const sheet = ss.getSheetByName(month);
    
    if (!sheet) {
      sheet = ss.insertSheet(month);
      const headers = ["Date", "Person", "Category", "Title", "Price", "Route"];
      sheet.getRange(1, 1, 1, headers.length).setValues([headers]);
      return { his: [], hers: [] };
    }
    
    const data = sheet.getDataRange().getValues();
    
    if (data.length < 2) {
      return { his: [], hers: [] };
    }
    
    const his = [];
    const hers = [];
    
    for (let i = 1; i < data.length; i++) {
      const row = data[i];
      
      if (!row || row.every(cell => !cell)) continue;
      
      const entry = {
        date: row[0] ? row[0].toString() : "",
        person: row[1] ? row[1].toString().trim() : "",
        category: row[2] ? row[2].toString().trim() : "",
        title: row[3] ? row[3].toString().trim() : "",
        price: parseFloat(row[4]) || 0,
        route: row[5] ? row[5].toString().trim() : "",
        rowIndex: i
      };
      
      if (!entry.title) continue;
      
      if (entry.person === '戰神') {
        his.push(entry);
      } else if (entry.person === '紫璃') {
        hers.push(entry);
      }
    }
    
    return { his, hers };
  } catch (error) {
    console.error('Error in getEntries:', error);
    return { his: [], hers: [] };
  }
}

// ============ ADD ENTRY ============
function addEntry(data) {
  try {
    const ss = SpreadsheetApp.getActiveSpreadsheet();
    let sheet = ss.getSheetByName(data.month);
    
    if (!sheet) {
      sheet = ss.insertSheet(data.month);
      const headers = ["Date", "Person", "Category", "Title", "Price", "Route"];
      sheet.getRange(1, 1, 1, headers.length).setValues([headers]);
    }
    
    const lastRow = sheet.getLastRow();
    const newRow = Math.max(lastRow + 1, 2);
    
    let route = "";
    if (data.category === "交通" && data.routeInput) {
      const routes = getRoutes();
      route = routes[data.routeInput] || data.routeInput;
    }
    
    const rowData = [
      data.date,
      data.person === 'his' ? '戰神' : '紫璃',
      data.category,
      data.title,
      parseFloat(data.price) || 0,
      route
    ];
    
    sheet.getRange(newRow, 1, 1, rowData.length).setValues([rowData]);
    
    return { 
      success: true, 
      message: `✅ ${data.person === 'his' ? '戰神' : '紫璃'}'s entry added!`,
      route: route
    };
  } catch (error) {
    console.error('Error in addEntry:', error);
    return { success: false, message: "❌ Error: " + error.toString() };
  }
}

// ============ DELETE ENTRY ============
function deleteEntry(month, rowIndex, person) {
  try {
    const ss = SpreadsheetApp.getActiveSpreadsheet();
    const sheet = ss.getSheetByName(month);
    if (!sheet) return { success: false, message: "Sheet not found" };
    sheet.deleteRow(rowIndex);
    return { success: true, message: "🗑️ Deleted!" };
  } catch (error) {
    console.error('Error in deleteEntry:', error);
    return { success: false, message: "❌ Error: " + error.toString() };
  }
}

// ============ GET SUMMARY ============
function getSummary(month) {
  try {
    const data = getEntries(month);
    const summary = {
      hisTotal: 0,
      hersTotal: 0,
      togetherTotal: 0,
      hisIncome: 0,
      hersIncome: 0,
      hisByCategory: {},
      hersByCategory: {}
    };
    
    data.his.forEach(entry => {
      const price = parseFloat(entry.price) || 0;
      if (entry.category === "收入") {
        summary.hisIncome += price;
      } else {
        summary.hisTotal += price;
        summary.hisByCategory[entry.category] = (summary.hisByCategory[entry.category] || 0) + price;
        if (entry.category === "一齊") {
          summary.togetherTotal += price;
        }
      }
    });
    
    data.hers.forEach(entry => {
      const price = parseFloat(entry.price) || 0;
      if (entry.category === "收入") {
        summary.hersIncome += price;
      } else {
        summary.hersTotal += price;
        summary.hersByCategory[entry.category] = (summary.hersByCategory[entry.category] || 0) + price;
        if (entry.category === "一齊") {
          summary.togetherTotal += price;
        }
      }
    });
    
    return summary;
  } catch (error) {
    console.error('Error in getSummary:', error);
    return {
      hisTotal: 0,
      hersTotal: 0,
      togetherTotal: 0,
      hisIncome: 0,
      hersIncome: 0,
      hisByCategory: {},
      hersByCategory: {}
    };
  }
}
